<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gift Portal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --accent:#ff6ec7;
    --accent2:#7b5cff;
    --accent3:#00c8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;background:#0b0620;overflow:hidden;position:relative;
  }
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(1200px 800px at 20% -10%, rgba(123,92,255,.55), transparent 60%),
      radial-gradient(900px 700px at 110% 20%, rgba(255,110,199,.45), transparent 55%),
      radial-gradient(700px 700px at 50% 120%, rgba(0,200,255,.35), transparent 60%),
      linear-gradient(180deg,#0b0620 0%,#140a35 50%,#1c0b3a 100%);
  }
  /* своя аниме-картинка: поставь url('anime.jpg') */
  .bg::after{
    content:"";position:absolute;inset:0;
    background-image:none;
    background-size:cover;background-position:center;
    opacity:.55;mix-blend-mode:screen;
  }
  .stars,.stars::after{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 30%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 35% 70%, #fff 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 65% 85%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 50% 15%, #fff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 90% 65%, #fff 50%, transparent 51%);
    background-repeat:repeat;background-size:400px 400px;opacity:.5;
    animation:drift 60s linear infinite;
  }
  .stars::after{content:"";opacity:.35;animation-duration:120s;background-size:600px 600px}
  @keyframes drift{from{background-position:0 0}to{background-position:400px 400px}}

  .wrap{
    position:relative;z-index:2;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:28px 20px calc(28px + env(safe-area-inset-bottom));
  }
  h1{
    font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:.5px;text-align:center;
    background:linear-gradient(90deg,#fff,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(255,110,199,.35);margin-bottom:4px;
  }
  .sub{font-size:13px;opacity:.7;margin-bottom:16px;text-align:center}

  .btn{
    width:100%;max-width:360px;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-radius:18px;border:1px solid rgba(255,255,255,.15);
    background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:#fff;font-size:17px;font-weight:700;letter-spacing:.3px;
    box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
    cursor:pointer;transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.97)}
  .btn .ico{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 20px rgba(255,110,199,.5);flex:0 0 auto;
  }
  .btn.a5{border-color:rgba(255,110,199,.5);box-shadow:0 8px 30px rgba(255,110,199,.25), inset 0 1px 0 rgba(255,255,255,.15)}
  .btn.a20{border-color:rgba(123,92,255,.5);box-shadow:0 8px 30px rgba(123,92,255,.25), inset 0 1px 0 rgba(255,255,255,.15)}
  .btn.a50{border-color:rgba(0,200,255,.5);box-shadow:0 8px 30px rgba(0,200,255,.25), inset 0 1px 0 rgba(255,255,255,.15)}
  .btn.a5  .ico{background:linear-gradient(135deg,#ff6ec7,#ff3d9a)}
  .btn.a20 .ico{background:linear-gradient(135deg,#7b5cff,#5b3dff)}
  .btn.a50 .ico{background:linear-gradient(135deg,#00c8ff,#0080ff);box-shadow:0 0 20px rgba(0,200,255,.5)}

  .btn .lbl{display:flex;flex-direction:column;align-items:flex-start;flex:1;margin-left:14px}
  .btn .meta{font-size:12px;font-weight:500;opacity:.6;margin-top:2px}
  .btn .arrow{font-size:22px;opacity:.55;flex:0 0 auto}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stars"></div>

<div class="wrap">
  <h1>Gift Portal</h1>
  <div class="sub">Выбери категорию лотов и перейди в канал</div>

  <button class="btn a5"  data-ch="-1004453237536">
    <span class="ico">⭐</span>
    <span class="lbl">До 5 TON<span class="meta">Свежие дешёвые лоты</span></span>
    <span class="arrow">›</span>
  </button>

  <button class="btn a20" data-ch="-1003838610428">
    <span class="ico">💎</span>
    <span class="lbl">До 20 TON<span class="meta">Средний сегмент</span></span>
    <span class="arrow">›</span>
  </button>

  <button class="btn a50" data-ch="-1003985042001">
    <span class="ico">👑</span>
    <span class="lbl">До 50 TON<span class="meta">Топовые лоты</span></span>
    <span class="arrow">›</span>
  </button>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#0b0620'); }

  // приватный канал -> t.me/c/<id без -100>/1
  function channelLink(rawId) {
    const s = String(rawId);
    const short = s.startsWith('-100') ? s.slice(4) : s.replace('-','');
    return `https://t.me/c/${short}/1`;
  }

  function openLink(url){
    if (tg?.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, '_blank');
  }

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => openLink(channelLink(btn.dataset.ch)));
  });

  // deep-link: ?tab=5|20|50 -> авто-открытие нужного канала
  const tab = new URLSearchParams(location.search).get('tab');
  if (tab) {
    const map = {'5':'.a5','20':'.a20','50':'.a50'};
    const el = document.querySelector(map[tab]);
    if (el) setTimeout(() => el.click(), 300);
  }
</script>
</body>
</html>
