<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traxser</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--accent:#ff6ec7;--accent2:#7b5cff;--accent3:#00c8ff;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;background:#0b0620;overflow-x:hidden;
  }
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(1200px 800px at 20% -10%, rgba(123,92,255,.55), transparent 60%),
      radial-gradient(900px 700px at 110% 20%, rgba(255,110,199,.45), transparent 55%),
      radial-gradient(700px 700px at 50% 120%, rgba(0,200,255,.35), transparent 60%),
      linear-gradient(180deg,#0b0620 0%,#140a35 50%,#1c0b3a 100%);
  }
  .bg::after{
    content:"";position:absolute;inset:0;background-image:none;
    background-size:cover;background-position:center;opacity:.5;mix-blend-mode:screen;
  }

  .app{position:relative;z-index:2;min-height:100dvh;padding:18px 14px 30px;max-width:560px;margin:0 auto}
  h1{
    font-size:26px;font-weight:800;letter-spacing:.5px;text-align:center;
    background:linear-gradient(90deg,#fff,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:2px;
  }
  .sub{font-size:12px;opacity:.6;text-align:center;margin-bottom:14px}

  /* фильтры */
  .tabs{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:3;
        padding:8px 0;background:linear-gradient(180deg,rgba(11,6,32,.95),rgba(11,6,32,.6));backdrop-filter:blur(8px)}
  .tab{
    flex:1;padding:12px 8px;border-radius:14px;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);color:#fff;font-weight:700;font-size:14px;
    cursor:pointer;text-align:center;transition:.15s;-webkit-tap-highlight-color:transparent;
  }
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;
              box-shadow:0 0 22px rgba(255,110,199,.45)}
  .tab:active{transform:scale(.97)}

  /* статус */
  .status{text-align:center;font-size:12px;opacity:.55;margin:10px 0}

  /* лента */
  .feed{display:flex;flex-direction:column;gap:10px}
  .card{
    border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;
    background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 26px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
    animation:in .3s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .name{font-weight:800;font-size:16px;letter-spacing:.2px}
  .card .price{
    font-weight:800;font-size:15px;white-space:nowrap;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card .ton{font-size:12px;opacity:.6;margin-top:2px}
  .card .row{display:flex;gap:8px;margin-top:12px}
  .card a{
    flex:1;text-align:center;padding:10px;border-radius:12px;text-decoration:none;color:#fff;
    font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);transition:.15s;
  }
  .card a.p{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;
            box-shadow:0 0 18px rgba(255,110,199,.4)}
  .card a:active{transform:scale(.97)}

  .empty{text-align:center;opacity:.5;font-size:13px;padding:40px 10px}
  .skel{height:86px;border-radius:18px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
        background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="bg"></div>

<div class="app">
  <h1>Traxser</h1>
  <div class="sub">Свежие лоты с маркета в реальном времени</div>

  <div class="tabs">
    <div class="tab active" data-max="5">⭐ До 5 TON</div>
    <div class="tab" data-max="20">💎 До 20 TON</div>
    <div class="tab" data-max="50">👑 До 50 TON</div>
  </div>

  <div class="status" id="status">Загрузка…</div>
  <div class="feed" id="feed"></div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#0b0620'); }

  // ← ЗАМЕНИ на адрес своего сервера
  const API = "http://ТВОЙ_IP:8000";

  const feed   = document.getElementById('feed');
  const status = document.getElementById('status');
  let currentMax = 5;

  function skeletons(n=4){
    feed.innerHTML = Array.from({length:n}).map(()=>'<div class="skel"></div>').join('');
  }

  function render(items){
    if (!items.length){
      feed.innerHTML = '<div class="empty">Пока пусто. Лоты появятся в течение минуты.</div>';
      return;
    }
    feed.innerHTML = items.map(x => `
      <div class="card">
        <div class="top">
          <div>
            <div class="name">${escapeHtml(x.title)} #${escapeHtml(String(x.num))}</div>
            <div class="ton">${x.stars} ⭐ · ${x.price_ton} TON</div>
          </div>
          <div class="price">${x.price_ton} TON</div>
        </div>
        <div class="row">
          <a class="p" href="${x.gift_link}" target="_blank" rel="noopener">Открыть лот</a>
          <a href="${x.seller_link}" target="_blank" rel="noopener">Продавец</a>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function load(){
    skeletons();
    status.textContent = 'Обновление…';
    try{
      const r = await fetch(`${API}/gifts?limit=60&max_ton=${currentMax}`, {cache:'no-store'});
      const data = await r.json();
      render(data.items || []);
      status.textContent = `Лотов: ${data.count} · обновлено ${new Date().toLocaleTimeString()}`;
    }catch(e){
      feed.innerHTML = '<div class="empty">Сервер недоступен</div>';
      status.textContent = 'Ошибка соединения';
    }
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      currentMax = Number(t.dataset.max);
      load();
    });
  });

  load();
  setInterval(load, 15000); // авто-обновление каждые 15 сек
</script>
</body>
</html>
